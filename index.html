    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,500..800;1,500..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Gracefully ignore WebSocket HMR disconnect errors in sandbox iframe environment
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (
          e.reason.message?.includes('WebSocket') ||
          e.reason.message?.includes('vite:ws') ||
          (typeof e.reason.stack === 'string' && e.reason.stack.includes('@vite/client'))
        )) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function(e) {
        if (e && (
          e.message?.includes('WebSocket') ||
          (typeof e.filename === 'string' && e.filename.includes('@vite/client'))
        )) {
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900 antialiased selection:bg-stone-900 selection:text-stone-50 min-h-screen">

  </body>
